# NickelOS's GRUB menu, inside the signed GRUB (a memdisk): nothing on the
# disk can change what boots or how. $grubdisk is the disk GRUB came from
# (ChromeOS's GRUB core sets it). gptpriority spends a try of a system not
# yet marked good and reports 0 once they are used up (patches/sys-boot/grub).
# NickelOS: no menu at boot; the choice between the two systems is
# automatic. Holding Shift, or pressing Esc in the first second, shows it:
# the way back to the other system by hand.
if keystatus --shift; then
  set timeout=-1
else
  set timeout_style=hidden
  set timeout=1
fi
# A superuser with no password: the menu editor and the GRUB shell stay
# closed; the entries boot without one (--unrestricted).
set superusers="nickelos"
gptpriority $grubdisk 2 prioA
gptpriority $grubdisk 4 prioB
probe --set=uuidA --part-uuid ($grubdisk,gpt3)
probe --set=uuidB --part-uuid ($grubdisk,gpt5)
if [ $prioA -lt $prioB ]; then set default=1; else set default=0; fi
# The image's own kernel arguments (its grub.cfg's "local image A" line).
set args="@ARGS@"
export grubdisk args uuidA uuidB
# Each system's entry boots the other one if its own kernel doesn't load
# (one whose signature doesn't verify under Secure Boot). GRUB prints the
# failed load's error and waits at "Press any key to continue" for at most
# 10 seconds, then boots what the entry loaded.
menuentry "NickelOS (A)" --unrestricted {
  if linux ($grubdisk,gpt12)/syslinux/vmlinuz.A $args root=PARTUUID=$uuidA; then boot; fi
  linux ($grubdisk,gpt12)/syslinux/vmlinuz.B $args root=PARTUUID=$uuidB
}
menuentry "NickelOS (B)" --unrestricted {
  if linux ($grubdisk,gpt12)/syslinux/vmlinuz.B $args root=PARTUUID=$uuidB; then boot; fi
  linux ($grubdisk,gpt12)/syslinux/vmlinuz.A $args root=PARTUUID=$uuidA
}
