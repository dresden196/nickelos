# The ISO's GRUB menu, inside its signed GRUB (a memdisk), as the installed
# system's is (scripts/secureboot): it finds the medium by NickelOS's image
# on it and starts the ISO's kernel and initramfs (scripts/iso/init).
#  - NickelOS (the default): NickelOS itself from the image, setup with its
#    installer ("Install NickelOS" or try it first), its writes in memory.
#    The kernel's arguments are the installed system's (its GRUB menu, from
#    scripts/build_kernel_image.sh), without root=: init mounts the root.
#  - The text-mode installer: the menu on the console, for a display
#    NickelOS's drivers don't start (the firmware's framebuffer through
#    simpledrm, which the installed system turns off).
set superusers="nickelos"
set default=0
set timeout=5
# root=/dev/ram0: only so the kernel unpacks the initramfs onto ramfs.
# Without a root= it uses tmpfs, and ChromeOS's security module refuses to
# run anything from tmpfs (its memfd rule: shmem files), init included.
menuentry "NickelOS" --unrestricted {
  search --no-floppy --file --set=root /nickelos/image.sqfs
  linux /nickelos/vmlinuz rdinit=/init root=/dev/ram0 noresume loglevel=1 console= initcall_blacklist=simpledrm_platform_driver_init i915.modeset=1 cros_efi @ARGS@
  initrd /nickelos/initrd.img
}
menuentry "NickelOS: text-mode installer" --unrestricted {
  search --no-floppy --file --set=root /nickelos/image.sqfs
  linux /nickelos/vmlinuz rdinit=/init root=/dev/ram0 loglevel=1 cros_efi nickelos.text @ARGS@
  initrd /nickelos/initrd.img
}
