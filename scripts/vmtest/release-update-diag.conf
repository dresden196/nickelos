# TEST COPY ONLY (release-update-test.sh with DIAG=1; never in a build):
# copies logs every minute to the unencrypted stateful partition, readable
# from the VM's disk afterwards (base images have no ssh). Upstart runs
# scripts with sh -e: the first failing command would end the loop.
description "test-only log copier"
start on started system-services
script
  set +e
  d=/mnt/stateful_partition/unencrypted/nickel-diag
  mkdir -p $d
  while true; do
    date > $d/last-copy.txt
    cp /var/log/messages $d/messages
    cp -rL /var/log/update_engine $d/
    cp -L /var/log/ui/ui.LATEST $d/ui.LATEST
    cp -L /var/log/chrome/chrome $d/chrome.log
    cp -L /home/chronos/user/log/chrome $d/chrome-user.log
    ls -la /home/chronos/ > $d/home-chronos.txt 2>&1
    initctl list > $d/initctl.txt 2>&1
    ps -eo pid,user,etime,args --sort=start_time > $d/ps.txt 2>&1
    sync
    sleep 60
  done
end script
