# Test only (NickelOS prototype): what failed, to the serial console.
description "uf debug"
start on started system-services or stopped startup
task
script
  sleep 30
  k=/dev/kmsg
  say() { while IFS= read -r l; do echo "ufdebug: $(echo "$l" | cut -c1-220)" > $k; done; }
  echo "ufdebug: begin" > $k
  ls -la /dev/dri/ 2>&1 | say
  ls -laZ /dev/dri/card0 2>&1 | say
  id chronos 2>&1 | say
  for j in udev udev-trigger udev-trigger-early dbus; do initctl status $j 2>&1 | say; done
  pgrep -a dbus-daemon | say
  pgrep -a udevd | say
  grep -hE "udevd|systemd-udevd" /var/log/messages | grep -vE "^.*INFO" | tail -8 | say
  ls -la /run/cups /run/dbus 2>&1 | head -6 | say
  grep denied /var/log/audit/audit.log 2>/dev/null | grep -oE "denied  \{ [a-z_ ]+\}|comm=\"[^\"]+\"|name=\"[^\"]+\"|tcontext=[^ ]+" | paste - - - - | sort | uniq -c | sort -rn | head -12 | say
  echo "ufdebug: end" > $k
end script
