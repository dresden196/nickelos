# fontconfig's cache where ChromeOS keeps it, in the image
# (/usr/share/cache/fontconfig, Google's cache-dir): Gentoo's default,
# /var/cache/fontconfig, is on the data partition, where ChromeOS blocks
# symlink traversal (kernel warnings as Chrome read the caches).
MYMESONARGS="-Dcache-dir=/usr/share/cache/fontconfig"
