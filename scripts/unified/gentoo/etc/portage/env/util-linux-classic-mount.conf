# NickelOS: libmount mounts with mount(2), as ChromeOS's sandboxes
# allow; util-linux 2.42 otherwise applies options like nosymfollow with
# mount_setattr, which minijail can't name on this board, and the install
# service's mount was killed (docs/unified.md).
EXTRA_ECONF="--disable-libmount-mountfd-support"
