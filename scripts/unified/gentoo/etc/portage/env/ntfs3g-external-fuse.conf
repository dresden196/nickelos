# ntfs-3g on libfuse 2 (sys-fs/fuse:0), as Google builds it: cros-disks
# opens /dev/fuse and hands ntfs-3g the descriptor, which libfuse 2 takes
# with Google's patch (patches/sys-fs/fuse-2.9.9). Gentoo builds ntfs-3g
# with its own copy of FUSE, which opens /dev/fuse itself and can't in
# cros-disks' sandbox: no other system's drive mounted.
EXTRA_ECONF="--with-fuse=external"
