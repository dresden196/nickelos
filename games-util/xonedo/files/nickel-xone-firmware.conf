description     "NickelOS: the Xbox Wireless Adapter's firmware, for xonedo"
author          "NickelOS"

# Started by 90-nickel-xone-dongle.rules when a dongle binds to xone-dongle;
# one instance per dongle (see the script).
start on nickel-xone-dongle-bound
instance $DONGLE
task
oom score -100

exec /usr/libexec/nickel-xone/nickel-xone-firmware "$DONGLE" "$PRODUCT"
