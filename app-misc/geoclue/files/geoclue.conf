# NickelOS: GeoClue for Linux apps (app-misc/geoclue). The location comes
# from the Wi-Fi networks wpa_supplicant has seen (shill's scans) and the
# internet address, through beaconDB. nickel-appd is the agent of the
# signed-in user: it follows ChromeOS's location switch (Settings > Privacy
# controls), so with it off no app gets a location. See geoclue(5).

[agent]
whitelist=nickel-appd

[ip]
enable=true
method=ichnaea

[network-nmea]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate
submit-data=false
submission-nick=geoclue

[compass]
enable=false

[static-source]
enable=false
