<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Ash requests "Google Sans" and "Google Sans Text" (ash/style/typography.cc and
  friends), which are proprietary and not shipped. Serve those requests with
  Google Sans Flex (OFL), the open rebuild of the same design.

  This must be <match> with mode="assign", not <alias>: Skia only accepts a
  substitute when the family left in the pattern after config equals the family
  that matched (SkFontConfigInterface_direct.cpp IsFallbackFontAllowed /
  acceptable_substitute). An alias leaves "Google Sans" in the pattern, so Skia
  would reject the match and fall back to Roboto.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>Google Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Google Sans Flex</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Google Sans Text</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Google Sans Flex</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Google Sans Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Google Sans Flex</string></edit>
  </match>
</fontconfig>
