# NickelOS defaults for elogind (sys-auth/elogind): ChromeOS's powerd is the
# only component that suspends the system. login1's Suspend, Hibernate,
# HybridSleep and SuspendThenHibernate calls report "na" and fail instead of
# suspending behind powerd's back.

[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
