# NickelOS defaults for elogind (sys-auth/elogind). elogind tracks sessions
# and seats; ChromeOS's powerd owns the power, reboot, suspend and hibernate
# keys, the lid switch, idle handling and suspend. Settings here keep elogind
# from acting on any of them alongside powerd. Override in a later file
# (e.g. 50-local.conf) in this directory, not here.

[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSecureAttentionKey=ignore
IdleAction=ignore
# Sign-out (a restart of ChromeOS's ui job) ends the session's processes;
# elogind does not kill them on its own.
KillUserProcesses=no
# Remove the user's runtime directory (/run/user/UID) as soon as the user's
# last session ends, as NickelOS did before elogind; no lingering user.
UserStopDelaySec=0
