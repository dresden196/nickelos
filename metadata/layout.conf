cache-format = md5-dict
eapis-banned = 0 1 2 3 4 5 6
masters = portage-stable chromiumos eclass-overlay reven
# profile-bashrcs lets profiles/base/package.bashrc hook packages that live in
# other overlays (used for the kernel config, see profiles/base/bashrc/).
profile-formats = portage-2 profile-bashrcs profile-default-eapi
profile_eapi_when_unspecified = 5-progress
repo-name = nickel
thin-manifests = true
use-manifests = strict
