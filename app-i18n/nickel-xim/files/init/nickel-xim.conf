description     "NickelOS: ChromeOS's input methods for X11 apps (XIM server)"
author          "NickelOS"

# With the session's X11 (nickel-x11), as the session user. nickel-xim waits
# for the display and sommelier's text-input socket, and exits when either
# goes (sommelier exits when Chrome restarts); the job starts it again.
start on started nickel-x11
stop on stopping nickel-x11
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/nickel-xim
