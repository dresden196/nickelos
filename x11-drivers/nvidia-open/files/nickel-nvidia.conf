# NickelOS: one driver per NVIDIA GPU. NVIDIA's open modules (nvidia-open)
# drive the GPUs NVIDIA lists for them (Turing and newer), nouveau the older
# ones. Both modules match every NVIDIA GPU, so udev loading either goes
# through nickel-nvidia-driver, which loads the right one.
install nvidia /usr/sbin/nickel-nvidia-driver nvidia
install nouveau /usr/sbin/nickel-nvidia-driver nouveau

# Kernel modesetting (Chrome drives the display through KMS) and a
# framebuffer console.
options nvidia-drm modeset=1 fbdev=1
