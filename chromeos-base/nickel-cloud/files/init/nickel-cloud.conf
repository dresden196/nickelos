description     "NickelOS: cloud storage in Files, through rclone"
author          "NickelOS"

# The user's cloud accounts (nickel-cloud): rclone's daemon and its mounts.
# When the session ends it unmounts them before the vault goes: a longer
# kill timeout than upstart's default for that.
start on started nickel-session and started-user-session
stop on stopping nickel-session
oom score -100
kill timeout 15
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/nickel-cloud
