description     "NickelOS: Gentoo's repository at the first startup, rebuilds after OS updates"
author          "NickelOS"

# Until Gentoo's repository (the package tree emerge reads) is there: from
# Gentoo's daily snapshot once the network answers (nickel-gentoo
# firstboot). The OS's Gentoo is in the image; this is only the tree. After
# an OS update, what it left waiting is rebuilt with your flags. Not a
# task: it may wait long for the network, and nothing waits for it.
start on stopped nickel-gentoo
oom score -100

exec /bin/sh -c 'exec /usr/sbin/nickel-gentoo firstboot >> /var/log/nickel-gentoo-setup.log 2>&1'
