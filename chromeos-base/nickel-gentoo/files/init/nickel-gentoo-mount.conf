description     "NickelOS: your layer of the OS's Gentoo into /usr and /etc"
author          "NickelOS"

# After an OS update the records first (nickel-gentoo mount). After
# ChromeOS's startup (the data partition mounted) and before its
# services: a task that starts on "starting boot-services" holds
# boot-services, and everything after it, until it is done. Started on
# "stopped startup" as boot-services is, the two raced, and a service that
# started first (spaced) took the overlay's /usr without the image's
# sandbox settings on it yet and failed. Also before anything mounts over
# files in /usr or /etc (nickel-accounts-setup's /etc/passwd,
# nickel-usr-local's /usr/local): the overlays
# would hide those. ChromeOS's own startup mounts (/usr/share/oem) go back
# on top of them.
# What an OS update did to your layer goes to a log: ChromeOS's upstart
# keeps no job output (no /var/log/upstart), and /var is mounted by now.
start on starting boot-services
task
oom score never

exec /bin/sh -c 'exec /usr/sbin/nickel-gentoo mount >> /var/log/nickel-gentoo-mount.log 2>&1'
