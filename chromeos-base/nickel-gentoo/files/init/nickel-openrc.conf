description     "NickelOS: your services from Gentoo, under OpenRC"
author          "NickelOS"

# Your services (rc-update add sshd default) start under OpenRC's default
# runlevel, after your layer is mounted and Gentoo's accounts are merged
# (nickel-gentoo), and stop before ChromeOS's services do. OpenRC runs only
# its default runlevel here: ChromeOS's init is Upstart, and the runlevels
# OpenRC would run as init (sysinit, boot's mounts) are ChromeOS's own
# (nickel-os stands in for them). docs/unified.md, "OpenRC".
start on stopped nickel-gentoo
stop on stopping system-services
oom score -100

pre-start exec /sbin/openrc default
post-stop exec /sbin/openrc nickel-stop
