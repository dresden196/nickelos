# NickelOS (nickel-gentoo keeps this file; OS updates bring its changes).
# Binary packages first: Gentoo's binhost, and NickelOS's for what Gentoo's
# doesn't have (binrepos.conf). Your own settings go in other files here
# (0200_nickelos_device.conf is this device's, written once at setup).
FEATURES="${FEATURES} getbinpkg"
# No preload sandbox: builds run the OS's /bin/sh and /bin/bash (the OS's
# own, in its own library world), which can't load Gentoo's libsandbox.so
# and said so for every command. Builds still run as the portage user, in
# Portage's network, IPC and PID sandboxes.
FEATURES="${FEATURES} -sandbox -usersandbox"
# Portage builds where it can run what it builds: your layer's directory,
# mounted exec at boot (ChromeOS mounts /var noexec, and a bind over
# /var/tmp/portage was hidden by a later mount of /var/tmp).
PORTAGE_TMPDIR="/run/nickel-gentoo/src/portage-tmp"
# A package that needs a newer version of one of the OS's packages than the
# OS has (the OS's are held at their versions, profile/package.mask/
# 00-nickel-os-versions) gets it, in one emerge: Portage unmasks that version
# (=, in package.unmask) and makes the USE changes a package needs
# (package.use), writes them, and goes on. The newer version goes into your
# layer until an OS update catches up. A world update needs none, so it
# leaves the OS as it is (vision decision 1, "Who updates what").
# ~amd64 keywords and licences stay your choice, as on any Gentoo. The two
# files take Portage's lines as it writes them (no ._cfg copies to merge).
EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --autounmask=y --autounmask-keep-masks=n --autounmask-keep-keywords=y --autounmask-license=n --autounmask-continue=y"
CONFIG_PROTECT_MASK="${CONFIG_PROTECT_MASK} /etc/portage/package.unmask /etc/portage/package.use"
