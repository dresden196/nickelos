# Steam for Gentoo (games-util/steam-launcher), the overlay Gentoo's wiki
# points to, on by default (Dresden, 2026-11-01). Fetched at the first
# startup like GURU; its testing keywords are accepted
# (package.accept_keywords/nickel-repos).
[steam-overlay]
location = /var/db/repos/steam-overlay
sync-type = git
sync-uri = https://github.com/anyc/steam-overlay.git
auto-sync = yes
