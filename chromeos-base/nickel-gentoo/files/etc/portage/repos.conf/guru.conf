# GURU, Gentoo's user repository, on by default (Dresden, 2026-11-01).
# nickel-gentoo fetches it at the first startup; emerge --sync keeps it
# current. Its packages carry testing keywords only, which
# package.accept_keywords/nickel-repos accepts.
[guru]
location = /var/db/repos/guru
sync-type = git
sync-uri = https://github.com/gentoo-mirror/guru.git
auto-sync = yes
