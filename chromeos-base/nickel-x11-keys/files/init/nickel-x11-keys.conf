description     "NickelOS: shortcut keys for X11 apps while other windows have the focus"
author          "NickelOS"

# With the session's X11 (nickel-x11), as the session user. It exits when the
# X display goes (sommelier exits when Chrome restarts) or Chrome closes its
# connection; the job starts it again. Chrome decides which keys it gets
# (Settings > Apps > Linux apps).
start on started nickel-x11
stop on stopping nickel-x11
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/nickel-x11-keys
