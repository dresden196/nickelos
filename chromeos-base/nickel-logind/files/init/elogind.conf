description     "elogind: tracks user sessions (logind without systemd)"
author          "NickelOS"

# NickelOS registers each user session with elogind (nickel-logind-session),
# so polkit, uaccess and apps using login1 know the active user. ChromeOS's
# powerd keeps power keys, lid and suspend: elogind ignores them
# (/etc/elogind/*.conf.d/20-nickelos.conf). After dbus (boot-services) and
# the cgroup mounts, before the ui and polkitd.
start on started boot-services and stopped cgroups
stop on stopping boot-services
oom score -100
respawn

env SYSTEMD_LOG_TARGET=syslog-or-kmsg

exec /usr/lib/elogind/elogind
