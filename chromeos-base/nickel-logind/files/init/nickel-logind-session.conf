description     "NickelOS: the user session's elogind session"
author          "NickelOS"

# Started by nickel-session-setup for the session's user; ends with the
# session. See nickel-logind-session.
stop on stopping nickel-session
kill timeout 10
oom score -100

import NICKEL_SESSION_USER

exec /usr/sbin/nickel-logind-session "${NICKEL_SESSION_USER}"

# The session id and cgroup are written once the session is open.
post-start script
  for i in $(seq 1 50); do
    [ -s /run/nickel/session/logind ] && exit 0
    sleep 0.1
  done
  logger -t "${UPSTART_JOB}" "no elogind session for ${NICKEL_SESSION_USER}"
end script
