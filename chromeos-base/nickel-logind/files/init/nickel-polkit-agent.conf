description     "NickelOS: the session's polkit authentication agent"
author          "NickelOS"

# Asks for an administrator's password when a program needs privileges
# through polkit (pkexec, system-wide Flatpaks, disk tools), with ChromeOS's
# own prompt, which Chrome shows (nickel-polkit-agent). It runs as root, in
# the session's elogind session (its cgroup), where nickel-session-exec puts
# session programs: polkit takes it as the session's agent, lets root
# register for the session's user, and only root may ask Chrome for a
# password (org.nickelos.PolkitAgent.conf). polkitd translates its messages
# into the agent's LANG: the session's.
start on started nickel-session and started-user-session
stop on stopping nickel-session
oom score -100
respawn
respawn limit 10 60

script
  cgroup=$(sed -n 2p /run/nickel/session/logind 2>/dev/null)
  if [ -n "${cgroup}" ]; then
    echo $$ > "/sys/fs/cgroup/elogind${cgroup}/cgroup.procs" || true
  fi
  lang=$(sed -n 's/^LANG=//p' /run/nickel/session/env 2>/dev/null)
  exec env LANG="${lang:-en_US.UTF-8}" /usr/libexec/nickel-polkit-agent
end script
