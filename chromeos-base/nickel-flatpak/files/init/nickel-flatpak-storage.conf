description     "NickelOS: system Flatpak apps live on the stateful partition"
author          "NickelOS"

# ChromeOS puts /var on the encrypted stateful volume, which is about 30% of
# the stateful partition and noexec. System-wide Flatpak apps (and games) need
# room and must run, so /var/lib/flatpak is a bind of
# /mnt/stateful_partition/nickel/flatpak, remounted exec,nosuid,nodev, like
# the Portage layer at /usr/local. Apps are public data; a powerwash wipes
# them with the rest of the stateful partition. chromeos_startup creates the
# directories listed in /usr/share/cros/startup/symlink_exceptions/
# nickel-flatpak-*.txt, which also allow the symlinks ostree uses.

start on stopped startup
task
oom score never

script
  if ! mountpoint -q /var/lib/flatpak; then
    mount --bind /mnt/stateful_partition/nickel/flatpak /var/lib/flatpak
    mount -o remount,bind,exec,nosuid,nodev /var/lib/flatpak
  fi
end script
