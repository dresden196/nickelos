description     "NickelOS: NVIDIA graphics for Flatpak apps, matched to the driver"
author          "NickelOS"

# Exits on its own on machines without an NVIDIA GPU.
start on started system-services and stopped nickel-flatpak-storage
stop on stopping system-services
oom score -100
respawn
respawn limit 3 3600
normal exit 0

exec /usr/sbin/nickel-flatpak-gpu
