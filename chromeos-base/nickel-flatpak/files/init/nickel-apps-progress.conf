description     "NickelOS: tell the user while the first boot installs the default apps"
author          "NickelOS"

# In the user's session, once Chrome shows it (notifications need it).
start on started nickel-session and started-user-session
stop on stopping nickel-session
oom score 0

exec /usr/sbin/nickel-session-exec /usr/libexec/nickel-flatpak/nickel-apps-progress
