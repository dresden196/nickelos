description     "NickelOS: install the default Flatpak apps on first boot"
author          "NickelOS"

# Not a task: it may wait a long time for the network, and nothing should
# block on it. Exits immediately once the defaults were installed.
# Again when a session starts: setup's choice (Full experience) is made
# after the first boot's run.
start on (started system-services and stopped nickel-flatpak-storage) or start-user-session
oom score -100

exec /usr/sbin/nickel-flatpak-defaults
