description     "NickelOS: no GRUB menu at boot on PCs installed before it"
author          "NickelOS"

# NickelOS boots without GRUB's menu: Shift (or Esc in the first second)
# shows it, as on Ubuntu (Dresden, 2026-10-27; nickel-image-grub puts it in
# the images). An update's postinstall writes the EFI system partition's
# grub.cfg with build_image's "set timeout=2" again, which shows both
# systems' entries at every boot (the AMD test PC and the NVIDIA test PC on 16852.17.4). So
# at every boot: where that line is there, the hidden menu's block replaces
# it (/usr/share/nickel/grub-hidden-menu.cfg). The GRUB the update put there
# has keystatus for Shift.
start on started system-services
task
oom score -100

script
  dev=$(rootdev -d -s) || exit 0
  esp=$(lsblk -lnpo NAME,PARTLABEL "${dev}" | awk '$2 == "EFI-SYSTEM" { print $1; exit }')
  [ -n "${esp}" ] || exit 0
  mnt=$(mktemp -d)
  if mount -t vfat -o rw,nodev,noexec,nosuid "${esp}" "${mnt}"; then
    cfg="${mnt}/efi/boot/grub.cfg"
    if [ -f "${cfg}" ] && grep -qx 'set timeout=2' "${cfg}"; then
      awk -v block=/usr/share/nickel/grub-hidden-menu.cfg '
        $0 == "set timeout=2" && !done {
          while ((getline line < block) > 0) print line
          done = 1
          next
        }
        { print }' "${cfg}" > "${cfg}.new" && mv "${cfg}.new" "${cfg}" &&
        logger -t nickel-grub-menu "GRUB's menu hidden (${esp})"
      sync
    fi
    umount "${mnt}"
  fi
  rmdir "${mnt}"
end script
