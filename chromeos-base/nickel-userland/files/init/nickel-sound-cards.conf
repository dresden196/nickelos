description     "NickelOS: CRAS starts once the HD-Audio cards are there"
author          "NickelOS"

# CRAS reads the sound cards when it starts and takes those that come later
# as they appear. On the AMD test PC (laptop, 2026-10-24) the HD-Audio cards
# register late (the HDMI one waits for amdgpu), and the Realtek card CRAS
# took as it appeared came out with no speaker and no mic, one boot in three
# (restarting CRAS, which reads the card whole, always had them). A task
# started by CRAS's own start holds it until each HD-Audio controller
# (snd_hda_intel, or an audio controller with no driver yet) has its card
# registered whole, and each HD-Audio codec its driver: 15 s at most, and
# 5 s for one no driver takes. "Whole": ALSA adds the card's sysfs directory
# first and its devices after it, its control device last (SNDRV_DEV_CONTROL,
# "this must be the last one"), so the card is ready once controlC<n> is
# there. Waiting only for the directory (r19) still lost the race on a slow
# boot: 2026-10-27, the AMD test PC's first boot after a flash, the Realtek card
# came up 11.8 s into the boot, the moment CRAS read it, with no speaker.
start on starting cras
task
oom score -100

script
  i=0
  while [ "${i}" -lt 150 ]; do
    waiting=
    for dev in /sys/bus/pci/devices/*; do
      case "$(cat "${dev}/class" 2>/dev/null)" in
      0x0403*) ;;
      *) continue ;;
      esac
      driver=$(basename "$(readlink "${dev}/driver" 2>/dev/null)" 2>/dev/null)
      if [ -z "${driver}" ]; then
        [ "${i}" -lt 50 ] && waiting="${dev##*/}"
      elif [ "${driver}" = snd_hda_intel ] && ! ls -d "${dev}"/sound/card*/controlC* >/dev/null 2>&1; then
        waiting="${dev##*/}"
      fi
    done
    for codec in /sys/bus/hdaudio/devices/*; do
      [ -e "${codec}" ] || continue
      [ -e "${codec}/driver" ] || waiting="${codec##*/}"
    done
    [ -z "${waiting}" ] && break
    sleep 0.1
    i=$((i + 1))
  done
  if [ -n "${waiting}" ]; then
    logger -t nickel-sound-cards "${waiting} not ready after 15 s: CRAS starts without it"
    exit 0
  fi
  # Then until the codecs are done: a codec's driver is bound before its
  # probe has made the card's PCMs, controls and jacks (the AMD test PC's Realtek codec
  # on 16852.17.4: CRAS took the card at 6.75 s, its headphone jack came at
  # 7.06 s, and CRAS had neither speaker nor headphone until restarted).
  # Half a second with no new sound or input device, three seconds at most.
  last= same=0 j=0
  while [ "${j}" -lt 30 ] && [ "${same}" -lt 5 ]; do
    now=$(ls /dev/snd /dev/input 2>/dev/null)
    if [ "${now}" = "${last}" ]; then
      same=$((same + 1))
    else
      same=0
      last=${now}
    fi
    sleep 0.1
    j=$((j + 1))
  done
  # And until udev has handled them: CRAS finds the jacks through udev's
  # records of the input devices, which come after the devices themselves
  # (udev was a second behind at this point on the AMD test PC; one boot in four
  # without this, CRAS had the HDMI card with no HDMI output).
  udevadm settle --timeout=3 || true
end script
