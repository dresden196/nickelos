description     "NickelOS: one of the machine's own services"
author          "NickelOS"

# /usr/local/etc/nickel/services/NAME/run, kept running as root: started by
# nickel-local-services at boot, restarted when it exits. pre-start refuses a
# file anyone but root can change.
import NAME
instance $NAME
stop on stopping system-services
respawn
respawn limit 10 60
oom score -100

pre-start exec /usr/sbin/nickel-local-services --check "${NAME}"
exec /usr/local/etc/nickel/services/${NAME}/run
