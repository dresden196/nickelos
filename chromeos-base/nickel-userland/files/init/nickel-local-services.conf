description     "NickelOS: the machine's own boot scripts and services"
author          "NickelOS"

# The root partition is replaced by every update, so what an administrator
# adds to the system itself (a VPN such as Tailscale, a server installed with
# Portage, a setting applied at boot) lives in /usr/local/etc/nickel, on the
# data partition (see nickel-local-services). Runs once system services are
# up, so the network is coming up too.
start on started system-services and stopped nickel-usr-local
task
oom score -100

exec /usr/sbin/nickel-local-services
