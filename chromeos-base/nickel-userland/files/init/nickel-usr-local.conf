description     "NickelOS: mount /usr/local, the machine's own programs and services"
author          "NickelOS"

# ChromeOS only mounts /usr/local (stateful dev_image) in developer mode. On
# NickelOS it holds the machine's own boot scripts and services
# (nickel-local-services) and a test image's tools, so it is always mounted,
# executable, and survives A/B updates like the rest of the stateful partition.
# (What you install with emerge goes to your layer of the OS's Gentoo
# instead: nickel-gentoo.) /usr/local is not in the loader's search: the
# image's ld.so.conf leaves it out (nickel-unify), so a library there never
# replaces the OS's copy; its programs find theirs through RUNPATH
# (nickel-local-rpath).
# Symlink/FIFO exceptions for it come from
# /usr/share/cros/startup/{symlink,fifo}_exceptions/nickel-*.txt, and
# chromeos_startup creates every path listed there, so dev_image exists by the
# time this runs. (Not tmpfiles.d: the SELinux policy has no file context for
# dev_image, so systemd-tmpfiles fails on it.)

# After Gentoo's overlays (nickel-gentoo-mount): a mount under /usr made
# before them would be hidden by the one on /usr.
start on stopped nickel-gentoo-mount
task
oom score never

script
  if ! mountpoint -q /usr/local; then
    mount --bind /mnt/stateful_partition/dev_image /usr/local
    # The stateful partition is noexec; the package layer has to run programs.
    mount -o remount,bind,exec,nosuid,nodev /usr/local
  fi
  # ChromeOS mounts /tmp nosymfollow; build tools, installers and test suites
  # create symlinks in /tmp and follow them. fs.protected_symlinks already
  # covers the classic /tmp symlink attack, as on other distributions.
  mount -o remount,symfollow /tmp
  # Test images come with dev_image already filled (test tools built for
  # /usr). They get their RUNPATHs once; on an empty /usr/local this takes no
  # time. nickel-build-stock does it when it makes the image (the
  # .nickel-rpath-done marker): here it rewrote ~850 MiB at first boot,
  # which from a USB stick held the boot up for many minutes. Older images
  # still get it here, at the lowest priority.
  if [ ! -e /var/cache/nickel-local-rpath-done ]; then
    if [ ! -e /usr/local/.nickel-rpath-done ]; then
      ionice -c 3 nice -n 19 /usr/sbin/nickel-local-rpath /usr/local
    fi
    : > /var/cache/nickel-local-rpath-done
  fi
end script
