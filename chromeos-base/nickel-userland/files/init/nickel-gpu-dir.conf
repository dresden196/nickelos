description     "NickelOS: where Chrome notes its GPU sandbox fallback"
author          "NickelOS"

# Chrome (patch 0082) writes /run/nickel/gpu/sandbox-off when no sandboxed
# GPU process initialized and GPU compositing was lost for it; while it is
# there the GPU process runs unsandboxed, so the machine still draws when a
# driver needs something the sandbox's rules lack. The browser runs as
# chronos at the sign-in screen and as the Linux user after sign-in, both in
# group chronos: the directory is theirs alone. /run clears it at boot, and
# the sandbox is tried again.
start on starting ui
task
oom score -100
exec sh -c 'mkdir -p /run/nickel/gpu && chown chronos:chronos /run/nickel/gpu && chmod 0770 /run/nickel/gpu'
