description     "NickelOS: the computer's name (org.freedesktop.hostname1)"
author          "NickelOS"

# Sets the kernel's hostname from /var/lib/nickel/hostname as it starts, so
# before the session (and its X11 cookie, nickel-x11) begins, then serves
# org.freedesktop.hostname1 for Settings > About and Linux apps.
start on started dbus
stop on stopping boot-services
oom score -100
respawn
respawn limit 10 60

exec /usr/libexec/nickel-hostname/nickel-hostnamed
