<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Distributed under the terms of the GNU General Public License v2

  nickel-hostnamed (root) owns org.freedesktop.hostname1 and checks every
  caller itself: changes only from root or an administrator (group wheel).
  Reading is open to all.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.hostname1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.hostname1"
           send_interface="org.freedesktop.hostname1"/>
    <allow send_destination="org.freedesktop.hostname1"
           send_interface="org.nickelos.Hostname1"/>
    <allow send_destination="org.freedesktop.hostname1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.hostname1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
