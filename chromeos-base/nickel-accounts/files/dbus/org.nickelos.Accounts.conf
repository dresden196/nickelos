<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Distributed under the terms of the GNU General Public License v2

  nickel-accountsd (root) checks every caller itself: CreateUser and
  DeleteUser only from root or the login screen's Chrome (chronos, no session
  running), SetPassword only from root or the user concerned with their
  current password, SetAdmin and RemoveUser only from an administrator with
  their password. ListUsers is open to all.
-->
<busconfig>
  <policy user="root">
    <allow own="org.nickelos.Accounts"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.nickelos.Accounts"
           send_interface="org.nickelos.Accounts"/>
  </policy>
</busconfig>
