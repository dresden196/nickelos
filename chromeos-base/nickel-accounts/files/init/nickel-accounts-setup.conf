description     "NickelOS: merge local accounts into /etc/passwd, group, shadow"
author          "NickelOS"

# /var (where the accounts live) is mounted by chromeos_startup. Runs before
# the login screen, so session_manager and cryptohome find the users.
# After Gentoo's overlay on /etc (nickel-gentoo-mount): it would hide the
# bind mounts over /etc/passwd, group and shadow.
start on stopped nickel-gentoo-mount
task
oom score never

exec /usr/sbin/nickel-accounts-setup
