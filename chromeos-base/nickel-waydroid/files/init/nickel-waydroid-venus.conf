description     "NickelOS: waydroid-nvidia's render server (Android on NVIDIA)"
author          "NickelOS"

# On NVIDIA, Android in Waydroid draws through this (app-containers/
# waydroid-nvidia): Mesa Venus inside Android sends its Vulkan calls over
# /run/waydroid-venus/venus.sock, and the server runs them on NVIDIA's driver.
# As the session user (who has /dev/udmabuf through group video), for as long
# as the session lasts, once nickel-waydroid-prepare has set Waydroid up for
# NVIDIA (it makes the socket's directory). Elsewhere it doesn't start.
# --no-virgl: Venus only. Android's side uses nothing else, and the GL
# renderer (vrend) can't start here ("failed to initialize vrend winsys"),
# which made the server refuse every client.
start on started nickel-session
stop on stopping nickel-session
oom score -100
respawn
respawn limit 10 60

# The socket goes with the server (nickel-waydroid-venus-socket says why).
pre-start script
  [ -d /run/waydroid-venus ] || { stop; exit 0; }
  /usr/libexec/nickel-waydroid/nickel-waydroid-venus-socket
end script
post-stop exec /usr/libexec/nickel-waydroid/nickel-waydroid-venus-socket

exec /usr/sbin/nickel-session-exec /usr/bin/env \
  RENDER_SERVER_EXEC_PATH=/usr/lib/waydroid-nvidia/libexec/virgl_render_server \
  /usr/lib/waydroid-nvidia/bin/virgl_test_server --venus --no-virgl --multi-clients \
  --socket-path /run/waydroid-venus/venus.sock
