description     "NickelOS: a session's Android launcher entries"
author          "NickelOS"

# When Android has been removed (Settings > Apps > Android apps, by an
# administrator, maybe signed in as someone else), the launcher entries
# Waydroid wrote for this user's Android apps would open nothing: take them
# away at sign-in. Their Android data stays in their home, for when Android
# is set up again.
start on started nickel-session
oom score -100
task

exec /usr/sbin/nickel-session-exec \
  /usr/libexec/nickel-waydroid/nickel-waydroid-session-check
