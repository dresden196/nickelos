description     "NickelOS: Waydroid's container manager (Android apps)"
author          "NickelOS"

# Waydroid runs Android in an LXC container; its container manager (root) owns
# the container and starts it when a user's session asks over D-Bus (Waydroid's
# session, which launching an Android app starts). It runs once Waydroid has
# its Android images (`waydroid init`), for as long as the system does.
# Before it starts, nickel-waydroid-prepare mounts cgroup v2, which keeps
# Android's network filters off the host (see the script).
start on started system-services
stop on stopping system-services
oom score -100
respawn
respawn limit 10 60

pre-start script
  /usr/libexec/nickel-waydroid/nickel-waydroid-prepare || { stop; exit 0; }
end script

exec /usr/bin/waydroid container start
