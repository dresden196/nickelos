description     "NickelOS: Android apps' root service (setup, ARM support, installs)"
author          "NickelOS"

# org.nickelos.Android on the system bus, for Settings > Apps > Android apps
# and the APK handler: sets Android up, turns ARM app support on and off,
# removes Android, and installs APKs with Android's own answer (see the
# script).
start on started system-services
stop on stopping system-services
oom score -100
respawn
respawn limit 10 60

exec /usr/libexec/nickel-waydroid/nickel-waydroidd
