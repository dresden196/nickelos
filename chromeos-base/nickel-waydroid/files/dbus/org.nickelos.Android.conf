<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Distributed under the terms of the GNU General Public License v2

  nickel-waydroidd (root) checks every caller itself: SetUp, Cancel, SetArm
  and Remove only from root or an administrator (group wheel),
  InstallPackage only from the user whose Android is running. GetState is
  open to all.
-->
<busconfig>
  <policy user="root">
    <allow own="org.nickelos.Android"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.nickelos.Android"
           send_interface="org.nickelos.Android"/>
  </policy>
</busconfig>
