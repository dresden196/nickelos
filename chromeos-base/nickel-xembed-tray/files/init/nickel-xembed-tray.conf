description     "NickelOS: old-style X11 tray icons (XEmbed) on ChromeOS's shelf"
author          "NickelOS"

# With the session's X11 (nickel-x11), as the session user. It exits when the
# X display goes (sommelier exits when Chrome restarts); the job starts it
# again. nickel-appd is the tray it hands the icons to.
start on started nickel-x11
stop on stopping nickel-x11
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/nickel-xembed-tray
