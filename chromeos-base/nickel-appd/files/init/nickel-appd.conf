description     "NickelOS: put native Linux apps in the launcher, start them"
author          "NickelOS"

# Lives as long as the user session's nickel-session job. Runs as the session
# user inside Chrome's mount namespace (see nickel-session-exec), so apps it
# starts see the user's files and reach Exo and the session bus.
# Waits for started-user-session, which the session's Chrome emits once the
# session is up: for a local account, the Chrome that started the session
# restarts first (to run as the account's user) and has no profile to take
# the app list.
start on started nickel-session and started-user-session
stop on stopping nickel-session
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/nickel-appd
