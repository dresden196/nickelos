<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Distributed under the terms of the GNU General Public License v2

  nickel-appd runs as the session user (the user Chrome runs as: chronos, or
  a local account's user, which is in group chronos). It owns
  org.nickelos.Apps, which Chrome calls to launch apps, and sends Chrome the
  app list (Chrome's own policy only lets vm_cicerone do that). The NickelOS
  portal backend, also the session user, asks Chrome for file dialogs.
-->
<busconfig>
  <policy group="chronos">
    <allow own="org.nickelos.Apps"/>
    <allow send_destination="org.nickelos.Apps"
           send_interface="org.nickelos.Apps"/>
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="UpdateApplicationList"/>
    <!-- The NickelOS portal backend asks Chrome for its file dialog. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="SelectFile"/>
    <!-- nickel-open: Linux apps open links in the browser and files with
         ChromeOS's default apps. -->
    <allow send_destination="org.chromium.UrlHandlerService"
           send_interface="org.chromium.UrlHandlerServiceInterface"
           send_member="OpenUrl"/>
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelOpenPath"/>
    <!-- nickel-open: mail links, to the website chosen in Default apps. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelOpenLink"/>
    <!-- The portal backend's ScreenCast: ChromeOS's picker and its frames. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelScreenCastChoose"/>
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelScreenCastStart"/>
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelScreenCastStop"/>
    <!-- Linux apps' notifications, as ChromeOS's own. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelNotify"/>
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelNotifyClose"/>
    <!-- Linux apps' tray icons, on the shelf. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelTrayItem"/>
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelTrayItemRemoved"/>
    <!-- Its RemoteDesktop: the user's permission, then input events. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelRemoteDesktopAsk"/>
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelRemoteDesktopInput"/>
    <!-- Its GlobalShortcuts: the user's permission and the keys, given a
         socket the key events come back through. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelShortcutsBind"/>
    <!-- nickel-x11-keys: shortcut keys for X11 apps in the background. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelX11KeysConnect"/>
  </policy>
  <!-- nickel-session's job (root) tells Chrome, as it stops, that the Linux
       apps are about to stop with the session. -->
  <policy user="root">
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"
           send_member="NickelSessionEnding"/>
  </policy>
</busconfig>
