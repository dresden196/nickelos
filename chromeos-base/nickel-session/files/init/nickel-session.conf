description     "NickelOS: per-login session for native Linux apps"
author          "NickelOS"

# session_manager emits start-user-session (with CHROMEOS_USER, which tells
# nickel-session-setup whose session it is) when someone signs in; a ChromeOS
# session always ends by restarting the ui job. The job's process is the
# session D-Bus bus that Flatpak, portals and GTK apps need.
start on start-user-session
stop on stopping ui
oom score -100
respawn
respawn limit 5 30

# ChromeOS's upstart passes an event's variables only to jobs that import
# them.
import CHROMEOS_USER

pre-start exec /usr/sbin/nickel-session-setup

# The XDG user directories (Downloads...) in My files, as the user. Jobs
# that start on "started nickel-session" (Valent) start after this.
post-start exec /usr/sbin/nickel-session-exec \
  /usr/libexec/nickel-session/nickel-user-dirs

# The env file is data, not sourced: ChromeOS shells refuse to source files
# from noexec mounts such as /run.
# The session bus starts the services it activates (the desktop portals
# among them) with its own environment: not GTK_USE_PORTAL or GDK_DEBUG,
# which make GLib and GTK go through the portals. In xdg-desktop-portal
# itself that loops (its Trash portal trashed through the Trash portal, and
# failed). Apps keep them: nickel-appd, the terminal and Valent start with
# the whole session environment.
script
  rt=$(sed -n 's/^XDG_RUNTIME_DIR=//p' /run/nickel/session/env)
  exec /usr/sbin/nickel-session-exec /usr/bin/env -u GTK_USE_PORTAL \
    -u GDK_DEBUG /usr/bin/dbus-daemon --session \
    --nofork --nopidfile --address="unix:path=${rt}/bus"
end script

# Before the Linux apps stop with this job: when the UI is stopping, tell
# Chrome, so full restore keeps the apps' windows rather than recording them
# as closed (Chrome patch 0018). This matters when the stop does not come from
# Chrome (`restart ui` or `reboot` from a shell): upstart stops this job
# before session_manager tells Chrome. Not on a plain `stop nickel-session`
# (no stop event). When Chrome ended the session itself, it is gone already.
pre-stop script
  if [ -n "${UPSTART_STOP_EVENTS:-}" ]; then
    dbus-send --system --print-reply --reply-timeout=3000 \
      --dest=org.chromium.VmApplicationsService \
      /org/chromium/VmApplicationsService \
      org.chromium.VmApplicationsService.NickelSessionEnding \
      >/dev/null 2>&1 || true
  fi
end script

post-stop exec /usr/sbin/nickel-session-cleanup
