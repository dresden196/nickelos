description     "NickelOS: X11 apps in the session (sommelier and Xwayland)"
author          "NickelOS"

# Lives as long as the user session's nickel-session job, as the session user
# (see nickel-x11). sommelier needs Exo's socket: it waits for
# started-user-session, which the session's Chrome emits once it is up (for a
# local account Chrome restarts after sign-in).
start on started nickel-session and started-user-session
stop on stopping nickel-session
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/libexec/nickel-session/nickel-x11
