description     "NickelOS: PipeWire in the session, for sound and screen sharing"
author          "NickelOS"

# Linux apps' sound, carried into CRAS by the nodes in
# pipewire.conf.d/nickel-cras.conf (PulseAudio apps through pipewire-pulse,
# nickel-audio; WirePlumber links the streams, nickel-wireplumber), and the
# screen, which apps get through the ScreenCast portal: its NickelOS backend
# publishes it as a PipeWire stream. As the session user, for as long as the
# session lasts.
start on started nickel-session
stop on stopping nickel-session
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/pipewire
