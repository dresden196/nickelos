description     "NickelOS: PipeWire's PulseAudio server in the session"
author          "NickelOS"

# PulseAudio apps (most Linux apps, every Flatpak with sound) talk to it; it
# plays through the session's PipeWire, whose nodes carry the sound into CRAS
# (nickel-pipewire). As the session user (a member of group cras), for as
# long as the session lasts.
start on started nickel-pipewire
stop on stopping nickel-session
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/pipewire-pulse
