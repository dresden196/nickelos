description     "NickelOS: WirePlumber, the session's PipeWire session manager"
author          "NickelOS"

# Links apps' audio streams to the CRAS nodes and keeps the defaults; manages
# no hardware (wireplumber.conf.d/90-nickel.conf). As the session user, for
# as long as the session lasts.
start on started nickel-pipewire
stop on stopping nickel-session
oom score -100
respawn
respawn limit 10 60

exec /usr/sbin/nickel-session-exec /usr/bin/wireplumber
