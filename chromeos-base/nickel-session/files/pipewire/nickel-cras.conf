# NickelOS: the session's sound goes to CRAS, which owns the sound cards and
# whose output and volume the user picks in ChromeOS. Linux apps play to and
# record from these two nodes (through pipewire-pulse for PulseAudio apps);
# both use ALSA's default device, which is CRAS's ALSA plugin. WirePlumber
# makes them the defaults and suspends them when idle, so CRAS sees a stream
# only while an app plays or records.
context.objects = [
    { factory = adapter
        args = {
            factory.name             = api.alsa.pcm.sink
            node.name                = "cras_out"
            node.description         = "CRAS"
            media.class              = "Audio/Sink"
            api.alsa.path            = "default"
            # Not timer-based: CRAS's plugin reports its position by period
            # (as PulseAudio's tsched=0 did).
            api.alsa.disable-tsched  = true
            audio.format             = "S16LE"
            audio.rate               = 48000
            audio.channels           = 2
            audio.position           = [ FL FR ]
            priority.driver          = 1000
            priority.session         = 1000
        }
    }
    { factory = adapter
        args = {
            factory.name             = api.alsa.pcm.source
            node.name                = "cras_in"
            node.description         = "CRAS"
            media.class              = "Audio/Source"
            api.alsa.path            = "default"
            api.alsa.disable-tsched  = true
            audio.format             = "S16LE"
            audio.rate               = 48000
            audio.channels           = 2
            audio.position           = [ FL FR ]
            priority.driver          = 1000
            priority.session         = 1000
        }
    }
]
