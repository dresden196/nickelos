# NickelOS: WirePlumber manages the session's PipeWire (links apps' streams,
# keeps defaults and volumes) and its webcams, but no sound hardware: CRAS
# owns the sound cards and Bluetooth audio. Sound reaches CRAS through the
# nodes in pipewire.conf.d/nickel-cras.conf.
#
# Webcams (V4L2; no libcamera) are nodes Linux apps get through the Camera
# portal, once the user allows each app (xdg-desktop-portal-nickel's Access
# dialog, the portal's permission store, find-portal-access.lua). Chrome's
# own camera stack (cros-camera) uses the same devices; one at a time
# streams.
wireplumber.profiles = {
  main = {
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = required
    monitor.libcamera = disabled
  }
}
