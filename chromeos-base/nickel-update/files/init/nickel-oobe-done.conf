description     "NickelOS: setup is done once a user session starts"
author          "NickelOS"

# update_engine checks for updates by itself only once setup is done, which
# it reads from /home/chronos/.oobe_completed. Chrome creates that file from
# a background task on the first sign-in, but NickelOS restarts Chrome to
# run as the user before the task runs, so it appeared only at the second
# sign-in: a new PC took no updates by itself until then
# (docs/updates.md). A started user session means setup is done.
start on start-user-session
task
oom score -100

script
  f=/home/chronos/.oobe_completed
  if [ ! -e "${f}" ]; then
    install -o chronos -g chronos -m 644 /dev/null "${f}" &&
      logger -t "${UPSTART_JOB}" "created ${f}"
  fi
end script
