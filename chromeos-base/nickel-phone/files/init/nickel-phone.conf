description     "NickelOS: phones, through Valent (KDE Connect), in the session"
author          "NickelOS"

# Valent runs as the session user for as long as the session lasts, so
# phones paired with the KDE Connect app find this computer and connect:
# notifications, files, clipboard, battery, media, remote input, SMS. Its
# window (the app launcher's Valent) talks to this instance.
# KDE Connect finds devices by UDP broadcast on 1716 and connects over TCP
# on 1714-1764 (files over the same range): ChromeOS's firewall lets them
# in only while Valent runs.
# Valent's window (GTK) needs Exo's socket when Valent starts: wait for
# started-user-session, which the session's Chrome emits once it is up (for
# a local account Chrome restarts after sign-in), as nickel-x11 does.
start on started nickel-session and started-user-session
stop on stopping nickel-session
oom score 0
respawn
respawn limit 10 60

pre-start script
  for ipt in iptables ip6tables; do
    for proto in udp tcp; do
      ${ipt} -w -I INPUT -p ${proto} --dport 1714:1764 -j ACCEPT
    done
  done
end script

exec /usr/sbin/nickel-session-exec /usr/libexec/nickel-phone/nickel-valent

post-stop script
  for ipt in iptables ip6tables; do
    for proto in udp tcp; do
      while ${ipt} -w -D INPUT -p ${proto} --dport 1714:1764 -j ACCEPT \
          2>/dev/null; do
        :
      done
    done
  done
end script
